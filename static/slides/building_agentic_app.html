section {

}

/* ── Professional Header/Banner ───────────────────────────────────── */
header {
  width: 90%;
  left: 5%;
  font-size: 18px;
  color: #888;
  border-bottom: 1px solid #007acc;
  text-align: left;
}
header .brand {
  color: #007acc;
  font-weight: bold;
}

/* ── Footer / Page Numbers ────────────────────────────────────────── */
footer {
  font-size: 14px;
  color: #aaa;
}

/* ── Typography Hierarchy ─────────────────────────────────────────── */
h1 {
  color: #007acc;
  font-size: 1.6em;
  margin-left: 0px;
  border-left: 8px solid #007acc;
  padding-left: 20px;
}
h2 {
  margin-left: 40px;
  font-size: 1.2em;
  color: #444;
}
h3 {
  margin-left: 80px;
  font-size: 1.0em;
  color: #666;
  font-style: italic;
}

/* ── List Styling ─────────────────────────────────────────────────── */
ul, ol {
  margin-left: 60px;
}
li {
  font-size: 22px;
  margin-bottom: 10px;
}
li strong {
  color: #007acc;
}

/* ── Image Centering ──────────────────────────────────────────────── */
img[alt~=&quot;center&quot;] {
  display: block;
  margin: 30px auto;
  border-radius: 8px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

/* ── Formatting Helpers ───────────────────────────────────────────── */
small { font-size: 0.7em; color: #777; vertical-align: middle; }
.highlight { background: #e6f7ff; padding: 2px 5px; border-radius: 4px; color: #007acc; font-weight: bold; }

/* ── Tables ───────────────────────────────────────────────────────── */
table {
  font-size: 18px;
  margin: 16px auto;
  border-collapse: collapse;
  width: 95%;
}
th {
  background-color: #007acc;
  color: white;
  padding: 8px 14px;
  text-align: left;
}
td {
  padding: 6px 14px;
  border: 1px solid #ddd;
}
tr:nth-child(even) { background-color: #f5f9ff; }

/* ── Code Blocks ──────────────────────────────────────────────────── */
pre {
  font-size: 0.72em;
  border-left: 4px solid #007acc;
  padding: 10px 14px;
  background: #f8f8f8;
  border-radius: 4px;
}
code {
  font-size: 0.85em;
  background: #f0f7ff;
  padding: 2px 5px;
  border-radius: 3px;
}
pre code {
  background: transparent;
  padding: 0;
}

/* ── Blockquotes ──────────────────────────────────────────────────── */
blockquote {
  border-left: 4px solid #007acc;
  background: #f0f7ff;
  padding: 10px 20px;
  margin: 16px 0;
  border-radius: 0 6px 6px 0;
  font-style: italic;
  color: #444;
}
blockquote p { margin: 0; }

/* ── Section Divider Slides ───────────────────────────────────────── */
section.section-divider {
  background-color: #007acc;
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-top: 60px;
}
section.section-divider h1 {
  color: white;
  border-left: 8px solid rgba(255,255,255,0.6);
  font-size: 2em;
}
section.section-divider h2 {
  color: #cce8ff;
  font-size: 1.3em;
  margin-left: 50px;
}
section.section-divider header {
  color: rgba(255,255,255,0.6);
  border-bottom-color: rgba(255,255,255,0.3);
}
section.section-divider header .brand { color: white; }
section.section-divider footer { color: rgba(255,255,255,0.5); }

/* ── Title Slide ──────────────────────────────────────────────────── */
section.title {
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
  padding-top: 40px;
}
section.title h1 {
  border-left: none;
  border-bottom: 4px solid #007acc;
  padding-left: 0;
  padding-bottom: 16px;
  text-align: center;
  font-size: 1.9em;
}
section.title h2 {
  margin-left: 0;
  color: #555;
  font-size: 1.3em;
}
section.title h3 {
  margin-left: 0;
  color: #888;
  font-size: 1.0em;
}

<h1 id="first-real-requirement-knowledge">First Real Requirement: Knowledge</h1>
<blockquote>
<p>&quot;Our agent must answer from <em>our</em> documents, not its training data.&quot;</p>
</blockquote>
<p>The innocent addition:</p>
<ol>
<li>Embed the user query → vector</li>
<li>Search the vector store → top-K chunks</li>
<li>Rerank results → inject into context</li>
<li>Generate with grounded context</li>
</ol>
<p><strong>What just happened:</strong></p>
<ul>
<li><strong>Two new network hops</strong> — embedding model, vector store</li>
<li><strong>Latency variance</strong>: 80 ms → 2 s depending on index load</li>
<li><strong>New failure modes</strong>: retrieval timeout, empty results, hallucination on weak matches</li>
<li><strong>New cost</strong>: embedding call + vector search per turn</li>
</ul>

<h1 id="second-real-requirement-tools">Second Real Requirement: Tools</h1>
<blockquote>
<p>&quot;Our agent must <em>do</em> things, not just answer.&quot;</p>
</blockquote>
<p>Adding MCP tools: filesystem · web search · CRM · calendar · code runner</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>User message
  → LLM decides: &quot;I need to call the CRM tool&quot;
    → tool call: GET /crm/contacts?name=Alice       (network I/O, 200ms)
    → LLM processes result: &quot;I need more info&quot;
      → tool call: GET /crm/deals?contact_id=123    (network I/O, 350ms)
  → LLM synthesizes final answer
→ Stream to user
</code></pre>
<p><strong>One user turn = multiple tool round-trips</strong><br />
Each call is remote, rate-limited, and can fail independently.<br />
Tool errors must produce a sensible response, not a stack trace.</p>

<h1 id="the-execution-model">The Execution Model</h1>
<p>Every external call is <strong>I/O-bound and unpredictable</strong></p>
<table>
<thead>
<tr>
<th>Call</th>
<th>Typical latency</th>
<th>Tail latency</th>
</tr>
</thead>
<tbody>
<tr>
<td>LLM (first token)</td>
<td>300 ms</td>
<td>3 s+</td>
</tr>
<tr>
<td>RAG retrieval</td>
<td>80 ms</td>
<td>2 s</td>
</tr>
<tr>
<td>MCP tool (simple)</td>
<td>50 ms</td>
<td>5 s</td>
</tr>
<tr>
<td>MCP tool (complex)</td>
<td>1 s</td>
<td>30 s+</td>
</tr>
</tbody>
</table>
<ul>
<li>Sequential <code>await</code> compounds latency — parallel fan-out is necessary</li>
<li>Token streaming is <strong>continuous</strong> — the client reads while the agent thinks</li>
<li>The application is always <strong>waiting on someone else's infrastructure</strong></li>
</ul>

<h1 id="what-breaks-when-you-ignore-this">What Breaks When You Ignore This</h1>
<ul>
<li><strong>Request timeouts</strong> at the HTTP layer — agent still thinking, connection dead</li>
<li><strong>WebSocket fragility</strong> — nginx upgrade headers, K8s ingress annotations, load balancer timeouts</li>
<li><strong>Token stream dropped mid-answer</strong> — user sees partial response, no way to resume</li>
<li><strong>No reconnect semantics</strong> — page refresh loses all context</li>
<li><strong>Sticky sessions required</strong> — horizontal scaling becomes painful</li>
</ul>
<br />
<blockquote>
<p><strong>Fred's lesson:</strong> WebSocket <em>felt</em> natural for streaming but was the wrong default.<br />
Every layer of infrastructure needed special configuration.<br />
The class of bugs it caused triggered the transport reform RFC.</p>
</blockquote>

<header><span class="brand">Agentic Apps</span> | From Demo to Industrial Reality</header>
<h1 id="the-right-transport-model">The Right Transport Model</h1>
<p>Replace WebSocket with <span class="highlight">HTTP Streaming (SSE)</span></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>POST /agents/execute/stream
Authorization: Bearer &lt;token&gt;
Content-Type: application/json

← HTTP 200  Content-Type: text/event-stream

data: {&quot;type&quot;: &quot;token&quot;,      &quot;content&quot;: &quot;The answer is&quot;}
data: {&quot;type&quot;: &quot;tool_start&quot;, &quot;tool&quot;: &quot;crm_lookup&quot;}
data: {&quot;type&quot;: &quot;token&quot;,      &quot;content&quot;: &quot; 42.&quot;}
data: {&quot;type&quot;: &quot;final&quot;,      &quot;session_id&quot;: &quot;abc123&quot;}
</code></pre>
<ul>
<li>Any reverse proxy handles this without special config (nginx, K8s ingress, CDN)</li>
<li>Standard <code>Authorization: Bearer</code> header — no token-in-message workaround</li>
<li><code>Last-Event-ID</code> enables <strong>client-side resume</strong> after connection drop</li>
<li>Works with <code>curl -N</code>, <code>k6</code>, <code>hey</code> — standard HTTP tooling, no sticky sessions</li>
</ul>

<h1 id="agents-that-take-time">Agents That Take Time</h1>
<p>Some work lasts <strong>minutes</strong>. Some lasts <strong>hours</strong>. Some waits for <strong>human approval</strong>.</p>
<p>The HTTP model assumes:</p>
<ul>
<li>Request arrives → response returns → done</li>
<li>Connection lifetime = execution lifetime</li>
</ul>
<p>Reality:</p>
<ul>
<li>Long analysis runs take 10–30 minutes</li>
<li>Document processing pipelines run overnight</li>
<li>A bank transfer approval might wait <strong>24 hours</strong></li>
<li><strong>If the process restarts: the work is lost</strong></li>
<li>The user sees a spinner forever</li>
</ul>

<h1 id="why-you-need-a-workflow-engine">Why You Need a Workflow Engine</h1>
<ul>
<li>A single request can trigger <strong>minutes of work</strong></li>
<li>Execution may involve <strong>multiple steps</strong> (LLM · tools · validation · HITL)</li>
<li>The process must survive:
<ul>
<li>API restarts, network failures, user disconnects</li>
</ul>
</li>
<li>Some steps require <strong>waiting for external input</strong> (human approval, events)</li>
</ul>
<p>You need:</p>
<ul>
<li>A way to <strong>persist execution state</strong></li>
<li>A way to <strong>resume exactly where you stopped</strong></li>
<li>A way to <strong>coordinate steps reliably over time</strong></li>
</ul>
<blockquote>
<p>This is not a function call anymore. This is a workflow for durable executions. Fred picked <a href="https://temporal.io/">Temporal</a>.</p>
</blockquote>

<header><span class="brand">Agentic Apps</span> | From Demo to Industrial Reality</header>
<h1 id="temporal-as-the-execution-backbone">Temporal as the Execution Backbone</h1>
<p><span class="highlight">Temporal</span> is not a queue. It is a durable state machine for long-running work.</p>
<ul>
<li><strong>Workflow</strong> — deterministic coordinator. No I/O, no LLM calls, no <code>time.time()</code>. Ever.</li>
<li><strong>Activity</strong> — the only place for I/O: LLM, tools, database, object store</li>
<li><strong>Signal / Update</strong> — how the outside world talks to a running workflow</li>
<li><strong>Retry policy</strong> — mandatory on every Activity: timeouts, backoff, non-retryable errors</li>
<li><strong>Heartbeat</strong> — long-running Activities must pulse to stay alive</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># Fred mandatory rule</span>
<span class="hljs-comment"># Workflows MUST NOT:  call LLMs · call tools · read files · use system time</span>
<span class="hljs-comment"># Activities MUST:     define timeouts · retry policies · heartbeat if long-running</span>
</code></pre>
<p>Fred: Agentic Temporal Worker runs separately from the API — independently deployable.</p>

<h1 id="the-streaming-bridge-problem">The Streaming Bridge Problem</h1>
<p>Temporal workflows produce results <strong>asynchronously</strong>. The user expects a <strong>live token stream</strong>.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>UI ──► request
        ──► Gateway
              ──► Temporal Workflow
                    ──► Agent Worker Pod
                          ──► Event Stream
                                ──► Gateway
                                      ──► SSE to UI
</code></pre>
<ul>
<li>Agent authors write normal <code>GraphAgent</code> code — they never see this bridge</li>
<li>The platform owns the bridge entirely</li>
<li>The hard part: back-pressure when client reads slowly, worker restart mid-stream, reconnect semantics</li>
</ul>
<br />
<p><small>Fred Phase 4 — still open work. The foundation (Temporal worker, SSE transport) is in place.</small></p>

<header><span class="brand">Agentic Apps</span> | From Demo to Industrial Reality</header>
<h1 id="two-different-problems-that-look-like-one">Two Different Problems That Look Like One</h1>
<p>State persistence in agentic apps has <strong>two distinct needs</strong> that must not be confused:</p>
<table>
<thead>
<tr>
<th></th>
<th><strong>Execution state</strong></th>
<th><strong>Conversation history</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td>Purpose</td>
<td>Resume after restart / HITL pause</td>
<td>UI display · audit · compliance · metrics</td>
</tr>
<tr>
<td>Consumer</td>
<td>The runtime (LangGraph graph)</td>
<td>The UI · compliance team · analytics</td>
</tr>
<tr>
<td>Query key</td>
<td><code>session_id</code> (thread)</td>
<td><code>user_id</code> · <code>agent_id</code> · time range</td>
</tr>
<tr>
<td>Lifecycle</td>
<td>Tied to the session</td>
<td><strong>Independent</strong> — survives session deletion</td>
</tr>
<tr>
<td>Format</td>
<td>LangGraph internal blobs</td>
<td>Clean timestamped messages</td>
</tr>
<tr>
<td>Storage pressure</td>
<td>Quadratic (accumulates per turn)</td>
<td>Linear (one row per message)</td>
</tr>
</tbody>
</table>
<p><strong>The mistake everyone makes:</strong> using the checkpointer for both.</p>
<blockquote>
<p>The checkpointer is built for <strong>resume</strong>. It was never designed as a query layer.</p>
</blockquote>

<header><span class="brand">Agentic Apps</span> | From Demo to Industrial Reality</header>
<h1 id="the-checkpointer-built-for-resume-not-history">The Checkpointer: Built for Resume, Not History</h1>
<p>Checkpointers store the (Lang)Graph execution state.</p>
<ul>
<li>What this gives you <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/>:
<ul>
<li>Survive process restart mid-conversation</li>
<li>Resume a graph from a HITL pause checkpoint</li>
<li>Any replica can pick up any session</li>
</ul>
</li>
<li>What it does <strong>not</strong> give you <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/>:
<ul>
<li>Per-message timestamps, cross-session queries by <code>user_id</code> or <code>agent_id</code></li>
<li>Conversation history for Graph agents (custom state, no <code>messages</code> field)</li>
<li>Tamper-evident records, long and configurable retention</li>
</ul>
</li>
</ul>
<blockquote>
<p>Accumulating all messages in <code>MessagesState</code> is an <strong>anti-pattern for history</strong>.<br />
Turn 50's checkpoint stores all 50 messages again — quadratic storage, opaque blobs.</p>
</blockquote>

<p><img src="diagrams/04-dual-write.png" alt="center" style="width:760px;" /></p>
<p>Every agent turn produces <strong>two independent writes</strong> from the same RuntimeEvent stream:</p>
<ul>
<li>the Checkpointer (execution state, for resume) and the HistoryStore (conversation turns, for UI + audit).</li>
<li>Independent lifecycles — deleting a session does not erase the audit trail.</li>
</ul>

<h1 id="the-historystore-what-it-enables">The HistoryStore: What It Enables</h1>
<p>One row per message, written at execution time from <code>RuntimeEvents</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>session_id · user_id · rank   (composite PK — idempotent upsert)
timestamp                     (UTC per message — not per checkpoint)
role                          (user / assistant / tool / system)
channel                       (final / tool_call / tool_result / error ...)
exchange_id                   (groups messages belonging to one turn)
parts_json                    (message content)
metadata_json                 (model · agent_id · finish_reason · token_usage)
</code></pre>
<p>What it unlocks:</p>
<ul>
<li><strong>UI</strong>: <code>GET /sessions/{id}/messages</code> — ordered history, no blob decoding</li>
<li><strong>Multi-session</strong>: list all sessions for a user, queryable by <code>user_id</code></li>
<li><strong>Compliance</strong>: per-message timestamp, survives session deletion, independent lifecycle</li>
<li><strong>Metrics</strong>: token usage per turn, per agent, per time window — directly queryable</li>
<li><strong>Agent-type-agnostic</strong>: ReAct <em>and</em> Graph agents emit <code>RuntimeEvents</code> — same write path</li>
</ul>

<header><span class="brand">Agentic Apps</span> | From Demo to Industrial Reality</header>
<h1 id="hitl-is-not-a-ui-problem">HITL Is Not a UI Problem</h1>
<blockquote>
<p>&quot;Please confirm before executing the bank transfer of €50,000.&quot;</p>
</blockquote>
<ul>
<li>
<p><strong>What actually needs to happen in production:</strong></p>
<ol>
<li>Agent reaches the confirmation point → <strong>pauses durably</strong></li>
<li>User closes the browser, goes home, sleeps</li>
<li>Next morning: user opens app, sees the pending approval</li>
<li>User confirms → agent <strong>resumes from the exact checkpoint</strong></li>
<li>If the confirm message is delivered twice → resume is <strong>idempotent</strong></li>
</ol>
</li>
<li>
<p><strong>Fred's model:</strong></p>
<ul>
<li>Activity returns <code>status=BLOCKED</code>, workflow waits deterministically</li>
<li>Session state owned by the platform, not the UI</li>
<li>HITL events are written to the HistoryStore like any other message</li>
</ul>
</li>
</ul>

<header><span class="brand">Agentic Apps</span> | From Demo to Industrial Reality</header>
<h1 id="the-attack-surface-of-an-agent">The Attack Surface of an Agent</h1>
<p>An agent <strong>ingests user content → calls an LLM → calls tools</strong>.<br />
Each hop is a trust boundary.</p>
<ul>
<li><strong>Prompt injection via RAG</strong> — malicious content in ingested documents hijacks agent behavior</li>
<li><strong>Overly broad tool permissions</strong> — agent can delete files, send emails, execute arbitrary code</li>
<li><strong>LLM output rendered in UI</strong> — XSS via generated markdown/HTML if not sanitized</li>
<li><strong>Credentials in prompts</strong> — API keys in system prompts, visible in logs and traces</li>
<li><strong>Tool response exfiltration</strong> — agent instructed to forward data to an attacker-controlled endpoint</li>
</ul>
<br />
<blockquote>
<p>The LLM is not the security boundary. <strong>The runtime is.</strong></p>
</blockquote>

<header><span class="brand">Agentic Apps</span> | From Demo to Industrial Reality</header>
<h1 id="identity-and-authentication">Identity and Authentication</h1>
<p><strong>Three distinct identities in an agentic system:</strong></p>
<ol>
<li><strong>End user</strong> — authenticated via JWT (Keycloak), scoped to their team and permissions</li>
<li><strong>Agent pod</strong> — M2M service identity, client credentials flow, bearer token on every outbound call</li>
<li><strong>Agent-to-agent</strong> — each hop must carry and validate identity; no implicit trust between agents</li>
</ol>
<p><strong>Fred:</strong></p>
<ul>
<li>Keycloak manages users and issues tokens</li>
<li><code>Authorization: Bearer</code> on every request — no token-in-message workaround</li>
<li>M2M configured via <code>security.m2m</code> in <code>AgentPodConfig</code></li>
<li><strong>Gatekeeper</strong> (inbound user auth check) separated from <strong>Relay</strong> (outbound token propagation)</li>
<li>CORS configured per pod via <code>authorized_origins</code></li>
</ul>
<footer>© 2025 Fred</footer>

<h1 id="authorization-rbac-is-not-enough">Authorization: RBAC Is Not Enough</h1>
<p><strong>RBAC answers:</strong> &quot;Can this user use this agent?&quot; ✓<br />
<strong>What you also need:</strong> &quot;Can this agent access <em>this team's</em> documents?&quot;</p>
<p><span class="highlight">Relationship-Based Access Control</span> — Zanzibar model, OpenFGA:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>organization:fred
    admin / editor / viewer   ← global Keycloak roles

team:northbridge
    owner / manager / member  ← OpenFGA tuples (per team)
    └──► library:northbridge-docs  ← only accessible to team members
</code></pre>
<p><strong>Key consequence:</strong></p>
<ul>
<li>A global <code>admin</code> can still be <strong>denied</strong> team write operations if not <code>owner/manager</code> of that team</li>
<li>Agents check team relations before accessing knowledge libraries</li>
<li>Policy evaluation at the platform boundary — never inside agent code</li>
</ul>
<footer>© 2025 Fred</footer>
</section>

<header><span class="brand">Agentic Apps</span> | From Demo to Industrial Reality</header>
<h1 id="policy-is-not-configuration">Policy Is Not Configuration</h1>
<table>
<thead>
<tr>
<th></th>
<th><strong>Configuration</strong></th>
<th><strong>Policy</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td>Question</td>
<td>&quot;Which model does agent X use?&quot;</td>
<td>&quot;What may team Y's agents do?&quot;</td>
</tr>
<tr>
<td>Changes when</td>
<td>Deploy time</td>
<td>Business / compliance decision</td>
</tr>
<tr>
<td>Evaluation</td>
<td>At startup</td>
<td>At every request</td>
</tr>
<tr>
<td>Owner</td>
<td>Platform engineer</td>
<td>Security / compliance team</td>
</tr>
<tr>
<td>Fred mechanism</td>
<td><code>models_catalog.yaml</code></td>
<td><code>conversation_policy_catalog.yaml</code></td>
</tr>
</tbody>
</table>
<br />
<p><strong>Fred principle:</strong> policy behavior must come from files, never from hardcoded values.</p>
<p>The moment a retention window or a model restriction is written as a constant in code,<br />
it becomes a <strong>compliance risk</strong> and a <strong>maintenance burden</strong>.</p>
<footer>© 2025 Fred</footer>

<header><span class="brand">Agentic Apps</span> | From Demo to Industrial Reality</header>
<h1 id="the-cost-problem">The Cost Problem</h1>
<p>Every agentic interaction is <strong>expensive by construction</strong></p>
<ul>
<li>LLM call: $0.001–$0.06 per 1K tokens — and context windows keep growing</li>
<li>RAG: embedding call + vector search + rerank <strong>per turn</strong></li>
<li>Tool calls: network I/O that delays the response and extends the context</li>
<li>HITL: workflow holds durable state across hours or days</li>
</ul>
<p><strong>At scale:</strong></p>
<ul>
<li>1,000 daily users × 10 turns × 2K tokens = <strong>20M tokens / day</strong></li>
<li>One slow tool call that triggers a retry <strong>doubles the cost</strong> for that turn</li>
<li>Multi-turn sessions: each turn includes prior history → cost grows quadratically</li>
</ul>
<p>Agentic apps are not just slower than traditional apps. They are structurally more expensive.</p>

</tr>

<header><span class="brand">Agentic Apps</span> | From Demo to Industrial Reality</header>
<h1 id="why-teams-of-agents">Why Teams of Agents?</h1>
<p><strong>One agent cannot do everything well.</strong></p>
<ul>
<li>Large context degrades LLM quality — focus beats omniscience</li>
<li>All-knowing prompts are fragile, untestable, and unmaintainable</li>
<li>Some tasks are naturally parallel: research + writing + fact-checking simultaneously</li>
<li>Specialization enables independent testing, versioning, and deployment of each agent</li>
</ul>
<br />
<blockquote>
<p>The software engineering argument does not disappear when we add LLMs.<br />
It becomes <strong>more</strong> important.</p>
</blockquote>
<p>A monolithic agent is a monolith — with all the operational problems monoliths carry,<br />
plus non-determinism from the model.</p>

<header><span class="brand">Agentic Apps</span> | From Demo to Industrial Reality</header>
<h1 id="what-breaks-in-multi-agent-systems">What Breaks in Multi-Agent Systems</h1>
<ul>
<li><strong>Session ownership</strong> — does Agent A or Agent B own the session state?</li>
<li><strong>Failure propagation</strong> — if Agent B fails mid-call, does Agent A retry B, or fail the whole task?</li>
<li><strong>Streaming</strong> — how does the user see progress from Agent B while Agent A is still running?</li>
<li><strong>Token budget</strong> — Agent A sends context to B, B sends context back → <strong>cost explodes</strong></li>
<li><strong>Authorization</strong> — can Agent A call Agent B's tools? On whose behalf?</li>
<li><strong>Versioning</strong> — Agent A expects output format v1, Agent B ships v2 silently</li>
</ul>
<br />
<blockquote>
<p>Each of these looks like a small problem.<br />
Together, they are the reason multi-agent systems fail in production.</p>
</blockquote>

<header><span class="brand">Agentic Apps</span> | From Demo to Industrial Reality</header>
<h1 id="the-software-engineering-challenge">The Software Engineering Challenge</h1>
<p>Multi-agent design is a <strong>distributed systems problem</strong>, not just an AI problem.</p>
<table>
<thead>
<tr>
<th>Problem</th>
<th>Classic distributed systems</th>
<th>Agentic systems</th>
</tr>
</thead>
<tbody>
<tr>
<td>Interface contract</td>
<td>API schema / protobuf</td>
<td>Agent input/output types</td>
</tr>
<tr>
<td>Version mismatch</td>
<td>Breaking change alerts</td>
<td>Silent prompt drift</td>
</tr>
<tr>
<td>Testing</td>
<td>Mock the dependency</td>
<td>Mock the LLM <em>and</em> the agent</td>
</tr>
<tr>
<td>Configuration</td>
<td>Service config file</td>
<td>Agent config + model config + policy</td>
</tr>
<tr>
<td>Debugging</td>
<td>Trace IDs, structured logs</td>
<td>Token streams, tool call chains</td>
</tr>
</tbody>
</table>
<p><strong>Fred's answer:</strong></p>
<ul>
<li>Explicit <code>AgentSpec</code> contracts: typed name, role, instructions</li>
<li>Typed Pydantic state passed between agents — no implicit message passing</li>
</ul>

<h1 id="configuration-explosion">Configuration Explosion</h1>
<ul>
<li>For each deployment, for each team, for each agent:
<ul>
<li>Which LLM? Which version? Which provider endpoint?</li>
<li>Which MCP servers are enabled for this agent?</li>
<li>Which knowledge libraries are visible to this team?</li>
<li>What is the maximum context length? The timeout?</li>
<li>Which output format does the downstream caller expect?</li>
</ul>
</li>
</ul>
<p><strong>10 agents × 20 teams = 200 potential configuration combinations</strong></p>
<p>Add model routing rules, retention policies, and access control tuples:<br />
→ the configuration matrix becomes <strong>unmanageable without structure</strong></p>
<blockquote>
<p>First class concern even if simple: every policy comes from a catalog file. No hardcoded values. No team-specific code paths.</p>
</blockquote>

<header><span class="brand">Agentic Apps</span> | From Demo to Industrial Reality</header>
<h1 id="the-catalog--registry-problem">The Catalog / Registry Problem</h1>
<blockquote>
<p>How does the platform know which agents exist and where to route requests?</p>
</blockquote>
<p><strong>Static catalog</strong> (Fred today):</p>
<ul>
<li>Loaded at startup by the platform (Gateway / Control Plane)</li>
<li>Fully deterministic and auditable — no implicit registration</li>
<li>Requires restart to add or modify an agent</li>
</ul>
<p><strong>Dynamic discovery</strong> (natural evolution on Kubernetes):</p>
<ul>
<li>Agents run as independent pods with their own lifecycle</li>
<li>Platform routes requests based on live availability</li>
<li>Discovery handled via standard (K8) mechanisms:
<ul>
<li>Kubernetes Services, DNS, labels, selectors</li>
</ul>
</li>
</ul>
<footer>© 2025 Fred</footer>

<header><span class="brand">Agentic Apps</span> | From Demo to Industrial Reality</header>
<h1 id="the-monorepo-trap">The Monorepo Trap</h1>
<p><strong>Today's common pattern: all agents in one process</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>agentic-backend/
├── agents/
│   ├── bank_transfer/     ← Team A's production agent
│   ├── hr_assistant/      ← Team B's production agent
│   └── data_analyst/      ← Team C's experimental agent
└── main.py                ← all agents start here, together
</code></pre>
<p><strong>Consequences:</strong></p>
<ul>
<li>One broken agent (OOM, startup exception, dependency conflict) can crash <strong>all agents</strong></li>
<li>Team C's experiment <strong>blocks</strong> Team A's production release</li>
<li>Every agent change triggers a <strong>full platform redeploy</strong></li>
<li>A resource-intensive agent degrades performance for all others</li>
</ul>
<p>This is the Fred v1 problem statement — the reason the pod architecture RFC exists.</p>

<p><img src="diagrams/09-pod-model.png" alt="center" style="width:500px;" /></p>

</code></pre>
<p>Agent authors write <code>ReActAgent</code> or <code>GraphAgent</code> — they never touch the worker process.</p>

<header><span class="brand">Agentic Apps</span> | From Demo to Industrial Reality</header>
<h1 id="what-comes-with-the-pod-model">What Comes With the Pod Model</h1>
<p>The pod model solves isolation and deployment — but it also brings the standard concerns of distributed systems:</p>
<ul>
<li><strong>Base image versioning</strong> — SDK upgrade → rebuild and roll out all pods</li>
<li><strong>Startup coordination</strong> — ordering and readiness between Control Plane and agents</li>
<li><strong>Distributed tracing</strong> — one request spans multiple pods</li>
<li><strong>Metrics aggregation</strong> — per-pod metrics → unified observability</li>
<li><strong>Versioning contracts</strong> — runtime and SDK compatibility across agents</li>
<li><strong>Secret management</strong> — per-agent credentials, strict isolation</li>
</ul>
<blockquote>
<p>None of this is new — this is the reality of any microservice architecture. Agentic systems do not remove these concerns. They inherit them.</p>
</blockquote>
<footer>© 2025 Fred</footer>

<ul>
<li><strong>Per request:</strong>
<ul>
<li>Token count (prompt / completion / total), cost estimate</li>
<li>Latency: time-to-first-token, tool call durations, RAG retrieval score</li>
<li>Tool call chain: which tools, in which order, with what inputs/outputs</li>
</ul>
</li>
<li><strong>Per session:</strong>
<ul>
<li>Conversation history, checkpoint state, HITL events</li>
<li>Which agent version handled which turn</li>
</ul>
</li>
<li><strong>Per workflow (durable agents):</strong>
<ul>
<li>Temporal history — complete, replay-safe audit trail</li>
<li>Status: RUNNING / BLOCKED / COMPLETED / FAILED</li>
</ul>
</li>
<li><strong>Per pod:</strong>
<ul>
<li>Health endpoint, resource usage (CPU / memory), queue depth, error rate</li>
</ul>
</li>
</ul>

<header><span class="brand">Agentic Apps</span> | From Demo to Industrial Reality</header>
<h1 id="protocol-landscape">Protocol Landscape</h1>
<table>
<thead>
<tr>
<th>Protocol / Surface</th>
<th>Designed for</th>
<th>What it is NOT</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>MCP</strong></td>
<td>Tool / resource / prompt interoperability</td>
<td>A chat UI stream protocol</td>
</tr>
<tr>
<td><strong>A2A</strong></td>
<td>Agent-to-agent communication and task collaboration</td>
<td>An end-user runtime contract</td>
</tr>
<tr>
<td><strong>OpenAI Realtime</strong></td>
<td>Low-latency multimodal / voice interaction</td>
<td>Multi-agent coordination</td>
</tr>
<tr>
<td><strong>AI SDK streaming</strong></td>
<td>Application/UI streaming patterns</td>
<td>Durable workflow orchestration</td>
</tr>
<tr>
<td><strong>WebSocket</strong></td>
<td>Bidirectional persistent transport</td>
<td>The only or best default for agent streaming</td>
</tr>
<tr>
<td><strong>HTTP SSE</strong></td>
<td>One-way streaming over standard HTTP</td>
<td>A bidirectional channel</td>
</tr>
</tbody>
</table>
<br />
<p><strong>Fred's position:</strong> HTTP SSE over a session contract.</p>
<ul>
<li><code>session_id</code> → <code>checkpoint_ref</code> → resume</li>
<li>Stateless at the connection level. Stateful at the session level.</li>
</ul>

<h1 id="the-fred-proposition">The Fred Proposition</h1>
<p><strong>The problem Fred is solving:</strong></p>
<blockquote>
<p>Agent authoring frameworks make it easy to write an impressive demo. They do not make it easy to <strong>operate</strong> an agent in production.</p>
</blockquote>
<p><strong>Fred's answer — four principles:</strong></p>
<ol>
<li><strong>Authoring stays portable</strong> — <code>fred-sdk</code> only, no platform dependency, fully testable offline</li>
<li><strong>Runtime owns operational discipline</strong> — retries, checkpoints, HITL, streaming: not the author's problem</li>
<li><strong>Platform owns policy</strong> — model routing, team access, retention: driven by files, never by code constants</li>
<li><strong>Infrastructure is transparent</strong> — HTTP SSE, standard proxies, no WebSocket magic, no sticky sessions</li>
</ol>
<br />
<blockquote>
<p>Fred does not treat the model as the system.<br />
It treats the model as <strong>one component</strong> inside a larger, controlled runtime.</p>
</blockquote>

<h1 id="a3--temporal-rules-quick-reference">A3 — Temporal Rules Quick Reference</h1>
<p><strong>Workflows MUST NOT:</strong></p>
<ul>
<li>Call LLMs, MCP servers, HTTP APIs, databases</li>
<li>Read/write files, object stores, or networks</li>
<li>Use <code>random</code>, <code>time.time()</code>, <code>uuid4()</code> (use Temporal APIs instead)</li>
<li><code>time.sleep()</code> — use <code>await workflow.sleep()</code> instead</li>
</ul>
<p><strong>Activities MUST:</strong></p>
<ul>
<li>Define <code>schedule_to_close_timeout</code> and <code>start_to_close_timeout</code></li>
<li>Define retry policies with explicit <code>non_retryable_error_types</code></li>
<li>Heartbeat regularly when running longer than a few seconds</li>
</ul>
<p><strong>HITL MUST:</strong></p>
<ul>
<li>Return <code>status=BLOCKED</code> from Activity — never block waiting inside an Activity</li>
<li>Wait via <code>Update</code> handler in Workflow (preferred over Signal)</li>
<li>Resume idempotently — safe to replay if the Update is delivered more than once</li>
</ul>

<header><span class="brand">Agentic Apps</span> | From Demo to Industrial Reality</header>
<h1 id="a5--http-streaming-vs-websocket">A5 — HTTP Streaming vs WebSocket</h1>
<table>
<thead>
<tr>
<th></th>
<th><strong>WebSocket</strong></th>
<th><strong>HTTP SSE (Fred)</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td>Direction</td>
<td>Bidirectional</td>
<td>Server → Client</td>
</tr>
<tr>
<td>Proxy config</td>
<td>Upgrade headers, special annotations</td>
<td>Standard HTTP — no config</td>
</tr>
<tr>
<td>K8s ingress</td>
<td>Annotations required</td>
<td>Works out of the box</td>
</tr>
<tr>
<td>Load balancer</td>
<td>Sticky sessions often required</td>
<td>Stateless, any replica</td>
</tr>
<tr>
<td>Auth</td>
<td>Token-in-message workaround needed</td>
<td><code>Authorization: Bearer</code> header</td>
</tr>
<tr>
<td>Dev proxy (Vite)</td>
<td><code>ws: true</code> required</td>
<td>Standard <code>proxy</code> config</td>
</tr>
<tr>
<td>Client resume</td>
<td>No built-in semantics</td>
<td><code>Last-Event-ID</code> header</td>
</tr>
<tr>
<td>Load testing</td>
<td>Specialized tooling</td>
<td><code>curl</code>, <code>k6</code>, <code>hey</code></td>
</tr>
</tbody>
</table>
<p><strong>HITL resume</strong> — user sends approval after closing the browser:<br />
→ new <code>POST /resume/stream</code> request — not a message on the same connection</p>

img[alt~=&quot;center&quot;] {
  display: block;
  margin: 30px auto;
  border-radius: 8px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

/* ── Formatting Helpers ───────────────────────────────────────────── */
small { font-size: 0.7em; color: #777; vertical-align: middle; }
.highlight { background: #e6f7ff; padding: 2px 5px; border-radius: 4px; color: #007acc; font-weight: bold; }

/* ── Tables ───────────────────────────────────────────────────────── */
table {
  font-size: 18px;
  margin: 16px auto;
  border-collapse: collapse;
  width: 95%;
}
th {
  background-color: #007acc;
  color: white;
  padding: 8px 14px;
  text-align: left;
}
td {
  padding: 6px 14px;
  border: 1px solid #ddd;
}
tr:nth-child(even) { background-color: #f5f9ff; }

/* ── Code Blocks ──────────────────────────────────────────────────── */
pre {
  font-size: 0.72em;
  border-left: 4px solid #007acc;
  padding: 10px 14px;
  background: #f8f8f8;
  border-radius: 4px;
}
code {
  font-size: 0.85em;
  background: #f0f7ff;
  padding: 2px 5px;
  border-radius: 3px;
}
pre code {
  background: transparent;
  padding: 0;
}

/* ── Blockquotes ──────────────────────────────────────────────────── */
blockquote {
  border-left: 4px solid #007acc;
  background: #f0f7ff;
  padding: 10px 20px;
  margin: 16px 0;
  border-radius: 0 6px 6px 0;
  font-style: italic;
  color: #444;
}
blockquote p { margin: 0; }

/* ── Section Divider Slides ───────────────────────────────────────── */
section.section-divider {
  background-color: #007acc;
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-top: 60px;
}
section.section-divider h1 {
  color: white;
  border-left: 8px solid rgba(255,255,255,0.6);
  font-size: 2em;
}
section.section-divider h2 {
  color: #cce8ff;
  font-size: 1.3em;
  margin-left: 50px;
}
section.section-divider header {
  color: rgba(255,255,255,0.6);
  border-bottom-color: rgba(255,255,255,0.3);
}
section.section-divider header .brand { color: white; }
section.section-divider footer { color: rgba(255,255,255,0.5); }

/* ── Title Slide ──────────────────────────────────────────────────── */
section.title {
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align: center;
  padding-top: 40px;
}
section.title h1 {
  border-left: none;
  border-bottom: 4px solid #007acc;
  padding-left: 0;
  padding-bottom: 16px;
  text-align: center;
  font-size: 1.9em;
}
section.title h2 {
  margin-left: 0;
  color: #555;
  font-size: 1.3em;
}
section.title h3 {
  margin-left: 0;
  color: #888;
  font-size: 1.0em;
}
