[build]
  publish = "public"
  functions = "functions"

[build.environment]
  NODE_VERSION = "20.11.0"
  NPM_VERSION = "10.2.4"
  HUGO_VERSION = "0.142.0"

[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

[context.next]
  command = "npm run build"

[context.next.environment]
  HUGO_ENV = "next"

[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 1313
  port = 8888
  publish = "public"
  autoLaunch = false

# Redirects and rewrites — https://docs.netlify.com/routing/redirects/#syntax-for-the-netlify-configuration-file

# Old reference pages consolidated into the standalone HTML topic pages.
[[redirects]]
  from = "/docs/reference/add-your-agent/"
  to = "/docs/add-your-agent.html"
  status = 301
  force = true

[[redirects]]
  from = "/docs/reference/deployment/"
  to = "/docs/deploy-gke.html"
  status = 301
  force = true

[[redirects]]
  from = "/docs/reference/architecture/"
  to = "/docs/architecture.html"
  status = 301
  force = true

[[redirects]]
  from = "/docs/reference/access-model/"
  to = "/docs/access-model.html"
  status = 301
  force = true

[[redirects]]
  from = "/docs/reference/llm_routing/"
  to = "/docs/llm-routing.html"
  status = 301
  force = true

# Legacy Hugo/Doks pages removed during the 2026-08 cleanup, redirected to
# their replacement.
[[redirects]]
  from = "/learn/"
  to = "/docs/what-is-fred.html"
  status = 301
  force = true

[[redirects]]
  from = "/guides/"
  to = "/releases/swift/guides/"
  status = 301
  force = true

[[redirects]]
  from = "/docs/quickstart/getting-started/"
  to = "/docs/getting-started.html"
  status = 301
  force = true

# Custom headers — https://docs.netlify.com/routing/headers/#syntax-for-the-netlify-configuration-file
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    # script-src hashes below cover the inline nav scripts in static/slides/*.html
    # (4 standalone slide decks, each with no <script src> — sha256 over the exact
    # <script>...</script> text). The Marp-built decks (fred_value_proposition,
    # fred_deployment_pattern, building_agentic_app) share 2 identical hashes since
    # `marp` emits byte-identical runtime JS regardless of deck content; the
    # hand-authored agent_capabilities.html has its own single hash. Recompute with
    # `python3 -c "import re,hashlib,base64; ..."` (see git history) if any deck's
    # <script> block itself is edited — editing slide prose does not change these.
    Content-Security-Policy = "default-src 'self'; manifest-src 'self'; connect-src 'self'; font-src 'self'; img-src 'self' https://avatars.githubusercontent.com data:; script-src 'self' 'sha256-D+O68mToZEw/dxyCM+3dsWbfovhlJAHl9cZj3ciBW6g=' 'sha256-Z4HMb1TZZsv/1G1Mab6N+iauuexRaFJnHAECXCpxyWY=' 'sha256-LAenlPISlHfDULoZ0Es1od1MkFw6zll5SAGSKQyQagM='; style-src 'self' 'unsafe-inline'"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin"
    Permissions-Policy = "geolocation=(self), microphone=(), camera=()"
    Cache-Control= '''
    public,
    max-age=31536000'''
    Access-Control-Allow-Origin = "*"
